<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Variant K — "Clean hex split" / DRS
       Just the diagonal two-tone hex + white glyph centered. No stripe,
       no extra ornament — the split alone is the family signature; the
       glyph carries the tool identity.
       Diagonal now runs vertex-to-vertex (top-right vertex (46,8) →
       bottom-left vertex (18,56)) for a geometrically clean split. -->

  <!-- Whole hex starts as deep navy -->
  <path d="M 18 8 L 46 8 L 60 32 L 46 56 L 18 56 L 4 32 Z"
        fill="#0E5A9C"/>

  <!-- Lower-right half: brighter blue quadrilateral
       (top-right vertex → right vertex → bottom-right vertex → bottom-left vertex,
        closing edge IS the diagonal split) -->
  <polygon points="46,8 60,32 46,56 18,56" fill="#2B8FD9"/>

  <!-- Tool glyph — { → } in white -->
  <path d="M22 22 C 18 22 18 25 18 28 C 18 31 16 33 15 33 C 16 33 18 35 18 38 C 18 41 18 44 22 44"
        stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M42 22 C 46 22 46 25 46 28 C 46 31 48 33 49 33 C 48 33 46 35 46 38 C 46 41 46 44 42 44"
        stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="24" y1="33" x2="40" y2="33" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="36,29 40,33 36,37" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
