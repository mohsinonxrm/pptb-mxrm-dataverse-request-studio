<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 8 56 48" width="56" height="48">
  <!-- Variant L — "Insider build" / DRS
       Same K chassis + a two-tone gold triangle filling the top-right
       vertex of the hex = Microsoft Office Insiders precedent.
       Gold is the Microsoft Insiders signature color across Office /
       Windows, deepened (#CC8A00 / #F2A100) so it reads at 20 px; reads
       as "Insider build" to anyone in the Microsoft ecosystem. -->

  <path d="M 18 8 L 46 8 L 60 32 L 46 56 L 18 56 L 4 32 Z" fill="#0E5A9C"/>
  <polygon points="46,8 60,32 46,56 18,56" fill="#2B8FD9"/>

  <!-- Insider stamp: flush with the top and right edges (the right point lies on the edge,
       46 + 14t, 8 + 24t with t = 0.375), split on the blue's diagonal (46,8 to 18,56),
       which crosses the stamp's long side at 43.58,12.15: dark left, light right like the blue -->
  <polygon points="37,8 46,8 43.58,12.15" fill="#CC8A00"/>
  <polygon points="46,8 51.25,17 43.58,12.15" fill="#F2A100"/>

  <!-- Tool glyph — { → } in white -->
  <path d="M22 22 C 18 22 18 25 18 28 C 18 31 16 33 15 33 C 16 33 18 35 18 38 C 18 41 18 44 22 44"
        stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M42 22 C 46 22 46 25 46 28 C 46 31 48 33 49 33 C 48 33 46 35 46 38 C 46 41 46 44 42 44"
        stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="24" y1="33" x2="40" y2="33" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="36,29 40,33 36,37" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
