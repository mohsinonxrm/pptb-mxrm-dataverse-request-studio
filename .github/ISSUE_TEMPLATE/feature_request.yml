name: ✨ Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Great feature requests include the **problem**, **who it helps**, and **what success looks like**.

  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues/discussions for duplicates.
          required: true

  - type: dropdown
    attributes:
      label: Area / scope
      description: Which part of DRS does this touch?
      options:
        - A new request mode
        - An existing mode (specify below)
        - URL builder / encoder
        - Code generator (xrm / xrm-batch / fetch / curl / PowerShell)
        - Results grid / detail view
        - Save / Load library
        - Settings / preferences
        - Theme / accessibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: "As a user, I want to..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any other approaches/workarounds you tried?
    validations:
      required: false

  - type: textarea
    attributes:
      label: UX / UI notes (Fluent UI v9)
      description: Any UI expectations, accessibility concerns, keyboard shortcuts, etc.
      placeholder: "e.g., new sidebar clause, CommandBar action, copy-to-clipboard behavior..."
    validations:
      required: false

  - type: textarea
    attributes:
      label: Dataverse considerations (if relevant)
      description: Tables, metadata, paging, throttling, $batch, permissions, OData quirks, etc.
      placeholder: "e.g., requires $expand chain, needs paging via @odata.nextLink, MSCRM.* header..."
    validations:
      required: false

  - type: textarea
    attributes:
      label: MS Learn reference (if relevant)
      description: Link to the Microsoft Learn page that documents this Web API feature.
      placeholder: "https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/..."
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Priority / impact
      options:
        - Nice to have
        - Important
        - Critical for adoption
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, examples, references to other tools (XrmToolBox, REST Builder, Postman, etc.).
    validations:
      required: false
