name: 🧩 Dataverse Web API request bug
description: Issues with the URL/body shape DRS produces, the code it generates, or metadata loading.
title: '[WebAPI Bug]: '
labels: ['bug', 'webapi', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Use this when the issue involves the wire shape of a request DRS built
        (URL / body / headers / code snippet) or anything Dataverse-side.

        ✅ Include HTTP status + request/correlation IDs if available.
        🚫 Do NOT paste secrets (tokens, Authorization headers).

  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I can reproduce consistently.
          required: false
        - label: I tested with a different entity / record and see similar behavior.
          required: false

  - type: input
    attributes:
      label: Tool version
      placeholder: 'e.g., v1.0.0 or commit SHA'
    validations:
      required: true

  - type: input
    attributes:
      label: PPTB version (if known)
      placeholder: 'e.g., 1.2.x'
    validations:
      required: false

  - type: input
    attributes:
      label: Dataverse Web API version (if known)
      placeholder: 'e.g., v9.2'
    validations:
      required: false

  - type: input
    attributes:
      label: Environment region (optional)
      placeholder: 'e.g., NA / EU / UK / APAC'
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Request mode
      options:
        - Retrieve Multiple
        - Retrieve Single
        - Retrieve NextLink
        - Predefined Query
        - Create
        - Update
        - Upsert
        - Delete
        - Merge
        - Associate
        - Disassociate
        - Execute Action
        - Execute Function
        - Execute Workflow
        - Manage File
        - Manage Image
        - Manage Attachment / Note
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Affected layer
      options:
        - URL shape (path / query string)
        - Request body (JSON shape, headers)
        - Code generator output (xrm / xrm-batch / fetch / curl / PowerShell)
        - Metadata loading (tables / columns / relationships / OptionSets)
        - Execute / response handling
        - Results grid rendering
        - Advisory / antipattern detection
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    attributes:
      label: URL DRS generated
      description: Copy from the URL bar in DRS (sanitize ids if needed).
      placeholder: '/api/data/v9.2/accounts?$select=name,...'
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Request body DRS generated (if any)
      description: Copy from the body preview card. Strip GUIDs / PII if you want.
      render: json
    validations:
      required: false

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open DRS in PPTB
        2. Pick mode
        3. Set <these clauses / fields>
        4. Click Execute
        5. Observe error / wrong shape
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: HTTP / error details (recommended)
      description: HTTP status + error payload from Dataverse (sanitize).
      placeholder: |
        Status: 400
        Error code: 0x...
        Message: ...
        Request/Correlation ID: ...
      render: shell
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Impact
      options:
        - Blocking (cannot use the mode)
        - Major (generates wrong shape; user has to hand-fix)
        - Minor (workaround exists)
        - Cosmetic / UI only
    validations:
      required: true
