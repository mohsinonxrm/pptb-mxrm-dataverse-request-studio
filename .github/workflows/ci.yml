name: CI

on:
  # Every PR, whatever its base: the ruleset requires `check` on dev, main, release/**
  # and support/** (RELEASING.md).
  pull_request:
  push:
    branches: [dev, main, "release/**", "support/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The tool must load from any path, e.g. the PPTB VS Code extension (#212).
      - name: No root-absolute asset URLs in dist
        run: |
          if grep -rnE '"/assets/|url\(/assets/' dist; then
            echo "::error::dist has root-absolute /assets/ URLs. Keep base: './' in vite.config.ts."
            exit 1
          fi
      # Monaco ships its own DOMPurify; vite.config.ts swaps in the npm one.
      - name: Check the bundled DOMPurify
        run: node .github/scripts/check-dompurify.mjs
      - run: npm run validate
