name: CI

on:
  # Every PR, whatever its base: the ruleset requires `check` on dev, main, release/**
  # and support/** (RELEASING.md).
  pull_request:
  push:
    branches: [dev, main, 'release/**', 'support/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, as in release.yml (#376)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Like the release build (#376): only esbuild and fsevents have install scripts, and
      # neither needs them
      - run: npm ci --ignore-scripts
      # The version, package-lock.json, the CHANGELOG section and the README badges agree
      # (#372, RELEASING.md).
      - name: Check the release metadata
        run: node .github/scripts/check-release.mjs
      - name: Audit runtime dependencies (no high or critical findings)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The tool must load from any path, e.g. the PPTB VS Code extension (#212).
      - name: No root-absolute asset URLs in dist
        run: |
          if grep -rnE '"/assets/|url\(/assets/' dist; then
            echo "::error::dist has root-absolute /assets/ URLs. Keep base: './' in vite.config.ts."
            exit 1
          fi
      - name: Check the bundled icon (Insider for pre-releases)
        run: node .github/scripts/check-release.mjs --dist
      # Monaco ships its own DOMPurify; vite.config.ts swaps in the npm one.
      - name: Check the bundled DOMPurify
        run: node .github/scripts/check-dompurify.mjs
      # What would be published: required files present, nothing dev-only, size budget (#273).
      - name: Check package contents
        run: |
          npm pack --dry-run --json --silent > "$RUNNER_TEMP/pack.json"
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
      - run: npm run validate
