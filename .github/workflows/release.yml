name: Release

# Pushing a vX.Y.Z (or vX.Y.Z-beta.N / -rc.N) tag publishes the package to npm through
# trusted publishing (no npm token) and creates the GitHub Release. See RELEASING.md.
# Same workflow as FetchXML Studio and Command Bar Studio (#90).

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # choosing the channel needs main's and support/*'s history
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use the latest npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Choose the release channel
        id: channel
        run: |
          # RELEASING.md: -beta.N / -rc.N -> npm "beta" (GitHub pre-release). A stable tag on
          # main -> "latest". A stable tag on support/X.Y -> "support-X.Y", never "latest".
          # Anything else fails here, so a stray tag can't replace "latest".
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-beta.*|*-rc.*)
              dist_tag=beta; latest=false; prerelease=true ;;
            *-*)
              echo "::error::Unsupported pre-release $GITHUB_REF_NAME. Use -beta.N or -rc.N (RELEASING.md)."
              exit 1 ;;
            *)
              prerelease=false
              line="${version%.*}"
              if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                dist_tag=latest; latest=true
              elif git rev-parse --verify --quiet "origin/support/$line" >/dev/null &&
                   git merge-base --is-ancestor "$GITHUB_SHA" "origin/support/$line"; then
                dist_tag="support-$line"; latest=false
              else
                echo "::error::Stable tag $GITHUB_REF_NAME is on neither main nor support/$line. Tag the release → main merge commit (RELEASING.md)."
                exit 1
              fi ;;
          esac
          echo "Publishing $GITHUB_REF_NAME to npm \"$dist_tag\" (GitHub latest: $latest, pre-release: $prerelease)"
          {
            echo "dist_tag=$dist_tag"
            echo "latest=$latest"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # The version, package-lock.json and the CHANGELOG section (#372, RELEASING.md)
      - name: Check the release metadata
        run: node .github/scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Check the bundled icon and write the release notes
        run: node .github/scripts/check-release.mjs --dist --notes "$RUNNER_TEMP/release-notes.md" --repository "$GITHUB_REPOSITORY"
      - name: Check the bundled DOMPurify
        run: node .github/scripts/check-dompurify.mjs
      - name: Check package contents
        run: |
          npm pack --dry-run --json --silent > "$RUNNER_TEMP/pack.json"
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
      # The notes check-release.mjs wrote: the PPTB requirement and the version's CHANGELOG
      # section (with its [#n] link definitions), then GitHub's generated list of PRs and the
      # compare link (gh puts --notes-file before the generated notes). The check above
      # guarantees the section exists, so there's no PR-list-only fallback.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.channel.outputs.latest }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --latest="$LATEST" --prerelease="$PRERELEASE"
